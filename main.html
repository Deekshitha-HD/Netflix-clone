<!DOCTYPE html>
<html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <link rel="icon" href="./assets/logo.png.png" type="image/x-icon">
 </head>

 <body>
     <div class="video-background">
        <video autoplay loop muted playsinline>
            <source src="./assets/MoanaTeaser.mp4" type="video/mp4">
        </video>
    
        <div class="content">
            <img src="./assets/Moanalogo.png" alt="movie title image" class="title-img">
            <p>Moana journeys to the far seas of Oceania after receiving an unexpected call from her wayfinding ancestors.</p>

               <div class="buttons">
                   <button class="btn play">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="white">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                       Play
                   </button>
      
                    <button class="btn more-info"> 
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="white">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                        </svg>                        
                         More Info
                    </button>
               </div>
          </div>
        </div>

       <div class="navbar">

          <div class="left-nav">

                <img src="./assets/logo2.png" alt="Netflix Logo" class="logo">
             
              <ul class="navigation">
                 <li><a href="/browse">Home</a></li>
                 <li><a href="/browse/genre/83">Tv Shows</a></li>
                 <li><a href="/browse/genre/34399">Movies</a></li>
                 <li><a href="/latest">New & Popular</a></li>
                 <li><a href="/browse/my-list">My List</a></li>
                 <li><a href="/browse/original-audio">Browse by language</a></li>
                </ul>
            </div>

          <div class="right-nav">
              <button class="icon-speaker" aria-label="Speaker"> 
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="white">
                    <path d="M3 10v4h4l5 5V5l-5 5H3zm13.5 2c0 1.77-.73 3.37-1.91 4.54l1.42 1.42A7.959 7.959 0 0 0 19.5 12a7.959 7.959 0 0 0-3.49-6.96l-1.42 1.42A5.99 5.99 0 0 1 16.5 12zm-2 0a3.99 3.99 0 0 1-1.17 2.83l1.41 1.41A5.99 5.99 0 0 0 18.5 12a5.99 5.99 0 0 0-2.26-4.64l-1.41 1.41A3.99 3.99 0 0 1 14.5 12z"/>
                  </svg>
                </button>
                

                <button class="icon-search" aria-label="Search">
                 <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="white">
                    <path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.98.98l.27.28v.79l5 5L20.49 19l-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/>
                 </svg>
                
                </button>

               <a href="/Kids">Children</a>

               <button class="icon-bell" aria-label="Notifications">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M10 21h4c0 1-1 2-2 2s-2-1-2-2zm11-3l-2-2V11c0-3.9-2.5-7.2-6-8.4V2a2 2 0 0 0-4 0v.6C5.5 3.8 3 7.1 3 11v5l-2 2v1h20v-1z"/>
                     </svg> 
                  <span class="notification-count">2</span>              
               </button>

              <div class="profile">
                  <img src="./assets/user.webp" alt="User Picture" class="profile-pic">
                  <div class="dropdown">
                     <ul class="dropdown-menu">
                          <li><a href="/account">Account</a></li>
                          <li><a href="/help">Help Center</a></li>
                          <li class="separator"></li>
                          <li><a href="/signout">Sign out</a></li>
                      </ul>
                  </div>
              </div>
          </div>
        </div>
    </body>


</html>
